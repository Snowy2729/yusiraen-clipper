name: Release

# package.json'daki sürüm numarası değişip main'e gönderilince, o sürüm henüz yayınlanmamışsa
# Windows kurulumunu derler ve GitHub Release olarak yayınlar.
on:
  push:
    branches: [main]
    paths-ignore: ["mod/**", ".github/workflows/mod-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bu sürüm zaten yayınlandı mı?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$VER zaten yayınlanmış, atlanıyor."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - name: Altyazı motoru önbelleği
        if: steps.ver.outputs.skip == 'false'
        id: wcache
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-cpp-v1.9.5-win64-static-1

      - name: Altyazı motorunu derle (whisper.cpp)
        if: steps.ver.outputs.skip == 'false' && steps.wcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build wcpp/build --config Release --target whisper-cli -j 4
          mkdir -p vendor/whisper
          EXE=$(find wcpp/build -name whisper-cli.exe | head -1)
          cp "$EXE" vendor/whisper/
          ls -la vendor/whisper

      - name: Uygulamayı paketle
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win dir --x64 --publish never

      - name: Paket içeriğini kontrol et
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          ls -la dist/win-unpacked/resources/whisper
          test -f dist/win-unpacked/resources/whisper/whisper-cli.exe
          dist/win-unpacked/resources/whisper/whisper-cli.exe --help 2>&1 | head -3 || true

      - name: Kurulum dosyasını oluştur (NSIS)
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          $nsi = Get-Content build/installer.nsi -Raw
          $nsi = $nsi -replace '!define VER "[^"]*"', "!define VER `"$ver`""
          $nsi = $nsi -replace 'VIProductVersion "[^"]*"', "VIProductVersion `"$ver.0`""
          Set-Content build/installer.nsi $nsi -Encoding utf8BOM
          $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress; $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location build
          & $mk /INPUTCHARSET UTF8 /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          Move-Item "dist/Yusiraen Clipper Kurulum.exe" "dist/Yusiraen-Clipper-Kurulum.exe"

      - name: GitHub Release yayınla
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="release-notes/${TAG}.md"
          [ -f "$NOTES" ] || echo "Yusiraen Clipper ${TAG}" > "$NOTES"
          gh release create "$TAG" "dist/Yusiraen-Clipper-Kurulum.exe" --target "$GITHUB_SHA" \
            --title "Yusiraen Clipper ${TAG}" --notes-file "$NOTES"
